services:
  postgres:
    image: postgres:16
    container_name: logs-postgres

    restart: always

    cpus: 1.0
    mem_limit: 1g

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .

    container_name: logs-app

    restart: always

    cpus: 0.5
    mem_limit: 256m

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "8080:8080"

volumes:
  postgres_data:
